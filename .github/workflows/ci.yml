name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # @raycast/api declares engines node >=22.14.0, and local development
          # runs on 24. Node 20 built fine but npm logged EBADENGINE on every
          # run, meaning CI was validating a configuration Raycast does not
          # support and that nobody develops on.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
